<div id="movie-modal-backdrop" class="modal-backdrop is-hidden">
  <div class="modal-container">
    <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close modal">&times;</button>
    <div class="modal-body">
      <img id="modal-poster" class="modal-poster" src="" alt="Movie Poster" />
      <div class="modal-info">
        <h2 id="modal-title" class="modal-title"></h2>
        <table class="modal-stats-table">
          <tbody>
            <tr>
              <td class="stat-label">Vote / Votes</td>
              <td class="stat-value">
                <span id="modal-vote" class="modal-vote-badge"></span> /
                <span id="modal-votes-count"></span>
              </td>
            </tr>
            <tr>
              <td class="stat-label">Popularity</td>
              <td id="modal-popularity" class="stat-value"></td>
            </tr>
            <tr>
              <td class="stat-label">Genre</td>
              <td id="modal-genre" class="stat-value"></td>
            </tr>
          </tbody>
        </table>
        <h3 class="about-title">ABOUT</h3>
        <p id="modal-overview" class="modal-overview"></p>
        <button type="button" id="library-toggle-btn" class="modal-btn">Add to My Library</button>
      </div>
    </div>
  </div>
</div>
